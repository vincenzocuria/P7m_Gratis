name: Mobile checks
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: |
          mkdir -p build/trust-tests
          javac -d build/trust-tests android/app/src/main/java/app/vcuria/p7m_gratis/CertificateTrust.java tool/CertificateTrustTest.java
          java -cp build/trust-tests app.vcuria.p7m_gratis.CertificateTrustTest test/fixtures
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: P7M-Gratis-Android-development
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/P7M-Gratis-iOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: P7M-Gratis-iOS-unsigned
          path: mobile/build/P7M-Gratis-iOS-unsigned.zip
      - name: Verify iPhone simulator
        run: |
          P7M_SIMULATOR="$(python3 -c 'import json,subprocess; d=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"])); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')"
          xcrun simctl boot "$P7M_SIMULATOR"
          xcrun simctl bootstatus "$P7M_SIMULATOR" -b
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/native_test.dart -d "$P7M_SIMULATOR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-simulator-screenshots
          path: mobile/build/screenshots/*.png
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: cd mobile && flutter pub get && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/native_test.dart -d emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-screenshots
          path: mobile/build/screenshots/*.png
